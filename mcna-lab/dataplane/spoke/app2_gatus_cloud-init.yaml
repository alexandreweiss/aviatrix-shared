#cloud-config
# Gatus reverse probes: MyApp2 -> transit gateways and MyApp1 VM, over Cato / the Aviatrix
# dataplane. Dashboard on HTTP port 80, private only.
package_update: true
packages:
  - docker.io
write_files:
  - path: /opt/gatus/config.yaml
    permissions: "0644"
    content: |
      web:
        port: 8080
      storage:
        type: memory
      ui:
        title: "MyApp2 -> transit / MyApp1 over Cato"
        header: "Reverse probes (from MyApp2)"
      endpoints:
        - name: Transit GW (10.10.0.36) ICMP
          group: transit
          url: "icmp://10.10.0.36"
          interval: 10s
          conditions:
            - "[CONNECTED] == true"
            - "[RESPONSE_TIME] < 400"
        - name: Transit HA GW (10.10.0.52) ICMP
          group: transit
          url: "icmp://10.10.0.52"
          interval: 10s
          conditions:
            - "[CONNECTED] == true"
            - "[RESPONSE_TIME] < 400"
        - name: MyApp1 VM (10.10.4.134) ICMP
          group: spoke
          url: "icmp://10.10.4.134"
          interval: 10s
          conditions:
            - "[CONNECTED] == true"
            - "[RESPONSE_TIME] < 400"
        - name: MyApp1 VM (10.10.4.134) TCP 22
          group: spoke
          url: "tcp://10.10.4.134:22"
          interval: 10s
          conditions:
            - "[CONNECTED] == true"
        - name: MyApp1 VM (10.10.4.134) TCP 80
          group: spoke
          url: "tcp://10.10.4.134:80"
          interval: 10s
          conditions:
            - "[CONNECTED] == true"
runcmd:
  - systemctl enable --now docker
  - docker run -d --name gatus --restart always -p 80:8080 --cap-add NET_RAW --sysctl net.ipv4.ping_group_range="0 2147483647" -v /opt/gatus/config.yaml:/config/config.yaml twinproduction/gatus:latest
